[package]
name = "ferrogram"
version = "0.11.0"
edition = "2024"
license = "MIT"
description = "Lightweight native Telegram desktop client written in Rust (unofficial)"
repository = "https://github.com/FerroApps/Ferrogram"
publish = false

[dependencies]
iced = { version = "0.14", features = ["tokio", "image", "advanced", "svg"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
grammers-client = "0.12"
grammers-session = { version = "0.12", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
keyring = "4.2"
secrecy = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
directories = "6"
notify-rust = "4"
chacha20poly1305 = "0.10"
png = "0.18"
futures = "0.3"
async-trait = "0.1"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
open = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
resvg = "0.45"
unicode-segmentation = "1"
libc = "0.2"
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
num-bigint = "0.4"
sha1 = "0.11"
sha2 = "0.11"
aes = "0.9"
ctr = "0.10"
hmac = "0.13"
rand = "0.9"
crc32fast = "1"
webrtc-dtls = "0.12"
opus = "0.3"
cpal = "0.16"
webrtc-util = { version = "0.11", default-features = false, features = ["conn"] }
audiopus_sys = { version = "0.2", features = ["static"] }
# Updater: small blocking HTTPS client on the rustls (ring) already in the tree; Ferrogram had no HTTP client.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Updater: read release tarballs (entries checked one by one, never `unpack`).
tar = { version = "0.4", default-features = false }
# Updater: gunzip release tarballs (already in the tree via grammers and png).
flate2 = "1"

[dev-dependencies]
tempfile = "3"
# Headless layout tests (cursor/hover behaviour of the real views); already in the iced tree.
iced_tiny_skia = "0.14"
iced_runtime = "0.14"
# Rasterise the info panel on the CPU in the scroll benchmark; both are already in the iced tree.
tiny-skia = "0.11"
zbus = "5"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
opt-level = 3

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
